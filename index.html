const resizePhoto = (file, maxDim = 160, quality = 0.85) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width,
        h = img.height;
      if (w > h) {
        if (w > maxDim) {
          h = Math.round(h * maxDim / w);
          w = maxDim;
        }
      } else {
        if (h > maxDim) {
          w = Math.round(w * maxDim / h);
          h = maxDim;
        }
      }
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => reject(new Error("No se pudo leer la imagen"));
    img.src = e.target.result;
  };
  reader.onerror = () => reject(new Error("No se pudo leer el archivo"));
  reader.readAsDataURL(file);
});

const parseVal = v => {
  if (typeof v === "number" && v >= 1 && v <= 8) return Math.round(v);
  if (typeof v === "string") {
    const t = v.trim();
    if (VMAP[t]) return VMAP[t];
    const n = parseFloat(t);
    if (!isNaN(n) && n >= 1 && n <= 8) return Math.round(n);
  }
  return 4;
};
function parseExcelModule(ab, fileName) {
  const wb = XLSX.read(new Uint8Array(ab), {
    type: "array"
  });
  const sn = wb.SheetNames.find(n => /matriz|conocimiento/i.test(n)) || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {
    header: 1,
    defval: ""
  });
  const items = [];
  let uid = Date.now();
  for (const row of rows) {
    const peso = parseFloat(row[0]);
    if (!peso || peso <= 0 || isNaN(peso)) continue;
    const desc = String(row[1] || "").trim(),
      ambito = String(row[2] || "").trim();
    if (!desc || !ambito || desc.length < 4) continue;
    if (/^(valoraci|desviaci|nivel)/i.test(desc)) continue;
    items.push({
      id: uid++,
      peso,
      desc,
      ambito,
      v1: parseVal(row[3]),
      v2: parseVal(row[4])
    });
  }
  const name = sn.replace(/conocimiento[\s_]*/i, "").replace(/[\s_]*matriz[\s_]*/i, " ").replace(/[\s_]+/g, " ").trim() || fileName.replace(/\.(xlsx?|xls)$/i, "");
  return {
    id: "mod-" + Date.now(),
    name: name || "Módulo importado",
    items,
    ambitoOrder: [...new Set(items.map(i => i.ambito))]
  };
}
const excelDateToISO = v => {
  if (v == null || v === "") return "";
  if (v instanceof Date) {
    if (isNaN(v)) return "";
    const y = v.getFullYear();
    if (y < 1950 || y > 2100) return "";
    return v.toISOString().slice(0, 10);
  }
  if (typeof v === "number") {
    if (v <= 0) return "";
    // Si es un año (ej: 2018), devolverlo directamente
    if (Number.isInteger(v) && v >= 1950 && v <= 2100) return `${v}-01-01`;
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    if (isNaN(d)) return "";
    const y = d.getFullYear();
    if (y < 1950 || y > 2100) return "";
    return d.toISOString().slice(0, 10);
  }
  const s = String(v).trim();
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) {
    const y = parseInt(m[3]);
    if (y < 1950 || y > 2100) return "";
    return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  }
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
    const y = parseInt(s.slice(0, 4));
    if (y < 1950 || y > 2100) return "";
    return s.slice(0, 10);
  }
  return "";
};
function exportarEmpleadosExcel(employees) {
  if (!employees.length) {
    alert("No hay empleados que exportar.");
    return;
  }
  const lista = employees.slice().sort((a, b) => a.nombre.localeCompare(b.nombre));
  const modsDe = e => e.modules && e.modules.length ? e.modules : e.module ? [e.module] : [];
  const skillsDe = e => e.skills && e.skills.length ? e.skills : e.skill ? [e.skill] : [];
  const nMod = Math.max(3, ...lista.map(e => modsDe(e).length));
  const nSkill = Math.max(3, ...lista.map(e => skillsDe(e).length));
  const fecha = v => {
    const m = String(v || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? `${m[3]}/${m[2]}/${m[1]}` : "";
  };
  const cab = ["Nombre", "Sector", ...Array.from({ length: nSkill }, (_, i) => "Skill " + (i + 1)), "Ubicación", "Antigüedad", "Experiencia SAP", ...Array.from({ length: nMod }, (_, i) => "Módulo " + (i + 1))];
  const filas = lista.map(e => {
    const sk = skillsDe(e), md = modsDe(e);
    return [e.nombre || "", e.sector || "", ...Array.from({ length: nSkill }, (_, i) => sk[i] || ""), e.location || "", fecha(e.antiguedad), fecha(e.expSap), ...Array.from({ length: nMod }, (_, i) => md[i] || "")];
  });
  const ws = XLSX.utils.aoa_to_sheet([cab, ...filas]);
  ws["!cols"] = cab.map((h, i) => ({ wch: i === 0 ? 34 : 18 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Empleados");
  XLSX.writeFile(wb, "empleados_" + new Date().toISOString().slice(0, 10) + ".xlsx");
}

function parseEmployeesExcel(ab) {
  const wb = XLSX.read(new Uint8Array(ab), {
    type: "array",
    cellDates: true
  });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {
    header: 1,
    defval: ""
  });
  const emps = [];
  const headers = rows[0].map(h => String(h || "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""));
  const findH = (...keys) => {
    const i = headers.findIndex(h => keys.some(k => h.includes(k)));
    return i >= 0 ? i : -1;
  };
  // Encuentra TODOS los índices de columnas de módulo (puede haber Módulo 1, Módulo 2, Módulo 3...)
  const moduleIdxs = headers.reduce((acc, h, i) => {
    if (h.includes("modulo") || h.includes("mod ")) acc.push(i);
    return acc;
  }, []);
  const skillIdxs = headers.reduce((acc, h, i) => {
    if (h.includes("skill")) acc.push(i);
    return acc;
  }, []);
  const idx = {
    sector: findH("sector"),
    skill: findH("skill"),
    location: findH("ubicacion", "ubicacion", "location"),
    antiguedad: findH("antiguedad", "antiguedad", "incorpora", "fecha inc"),
    expSap: findH("experiencia", "exp sap", "exp. sap")
  };
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r[0]) continue;
    const nombre = String(r[0] || "").trim();
    if (!nombre) continue;
    const modules = moduleIdxs.map(mi => String(r[mi] || "").trim()).filter(Boolean);
    const skills = skillIdxs.map(si => String(r[si] || "").trim()).filter(Boolean);
    const emp = {
      id: "emp-" + Date.now() + Math.random(),
      nombre,
      modules,
      module: modules[0] || "",
      sector: idx.sector >= 0 ? String(r[idx.sector] || "").trim() : "",
      skill: skills[0] || "",
      location: idx.location >= 0 ? String(r[idx.location] || "").trim() : "",
      antiguedad: idx.antiguedad >= 0 ? excelDateToISO(r[idx.antiguedad]) : "",
      expSap: idx.expSap >= 0 ? excelDateToISO(r[idx.expSap]) : ""
    };
    if (skillIdxs.length) emp.skills = skills;
    emps.push(emp);
  }
  return emps;
}

// PDF: captura cada bloque del panel de KPIs y lo maqueta en A4 apaisado (los bloques más altos que una página se trocean)
const cargaExportarPDF = async (contenedor, titulo, subtitulo, nombre) => {
  await cargaCargarLib(CARGA_LIBS.h2c);
  await cargaCargarLib(CARGA_LIBS.jspdf);
  const pdf = new window.jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
  const W = 297, H = 210, M = 10, TOPE = M + 16, PIE = H - 10, ancho = W - 2 * M;
  let pagina = 0, y = TOPE;
  const nuevaPagina = () => {
    if (pagina) pdf.addPage();
    pagina++;
    pdf.setFillColor(0, 205, 226); pdf.rect(M, M, 1.2, 9, "F");
    pdf.setFont("helvetica", "bold"); pdf.setFontSize(13); pdf.setTextColor(25, 37, 91); pdf.text(titulo, M + 4, M + 4.5);
    pdf.setFont("helvetica", "normal"); pdf.setFontSize(8); pdf.setTextColor(59, 71, 121); pdf.text(subtitulo, M + 4, M + 9);
    pdf.text(`Página ${pagina}`, W - M, H - 5, { align: "right" });
    y = TOPE;
  };
  nuevaPagina();
  for (const bloque of contenedor.children) {
    const canvas = await window.html2canvas(bloque, { scale: 2, backgroundColor: "#f0f4f8", logging: false });
    if (!canvas.width || !canvas.height) continue;
    const mmPx = ancho / canvas.width;
    const alto = canvas.height * mmPx;
    if (y + alto > PIE && y > TOPE && alto <= PIE - TOPE) nuevaPagina();
    if (y + alto <= PIE) {
      pdf.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", M, y, ancho, alto);
      y += alto + 4;
      continue;
    }
    if (y > TOPE) nuevaPagina();
    for (let origen = 0; origen < canvas.height;) {
      const trozo = Math.min(canvas.height - origen, Math.floor((PIE - y) / mmPx));
      const c = document.createElement("canvas");
      c.width = canvas.width; c.height = trozo;
      c.getContext("2d").drawImage(canvas, 0, origen, canvas.width, trozo, 0, 0, canvas.width, trozo);
      pdf.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", M, y, ancho, trozo * mmPx);
      origen += trozo;
      y += trozo * mmPx + 4;
      if (origen < canvas.height) nuevaPagina();
    }
  }
  pdf.save(nombre);
};

  const mapa = new Map();
  for (const m of meses) {
    const anio = m.slice(0, 4), q = Math.floor((parseInt(m.slice(5, 7), 10) - 1) / 3) + 1, clave = `${anio}-T${q}`;

    ...t, meses: t.meses.sort(), completo: t.meses.length === 3 && t.meses.every(m => m < mesActual),

<script>
  const _auth = firebase.auth();

  const INACTIVITY_TIMEOUT = 15 * 60 * 1000;
  let lastActivity = Date.now();
  let authCheckInterval = null;

  function resetInactivity() { lastActivity = Date.now(); }
  document.addEventListener('mousemove', resetInactivity);
  document.addEventListener('keydown', resetInactivity);
  document.addEventListener('click', resetInactivity);

  function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';
    _auth.signInWithEmailAndPassword(email, pass)
      .catch(() => { errEl.textContent = 'Credenciales incorrectas'; });
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));

  _auth.onAuthStateChanged(user => {
    if (user) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('root').style.display = 'block';
      root.render(React.createElement(App, null));
      authCheckInterval = setInterval(() => {
        if (Date.now() - lastActivity > INACTIVITY_TIMEOUT) { _auth.signOut(); }
      }, 60000);
    } else {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('root').style.display = 'none';
      if (authCheckInterval) { clearInterval(authCheckInterval); authCheckInterval = null; }
    }
  });

  window.doLogout = function() { _auth.signOut(); };
  window._db = _db;
  window._auth = _auth;

</script>
